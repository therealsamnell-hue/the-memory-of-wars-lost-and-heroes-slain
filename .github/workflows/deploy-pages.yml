name: Deploy Player Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "player-content/**"
      - "quartz.config.yaml"
      - "quartz.lock.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build published player notes
        run: npx quartz build -d "player-content/8. Player Wiki"

      - name: Verify publish filtering
        run: |
          test -f public/index.html
          if test -e public/Locations/Sathara.html; then
            echo "ERROR: Sathara.md has publish: false but was emitted."
            exit 1
          fi
          echo "Publish filtering passed: the unpublished Sathara page is absent."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
