name: Deploy Player Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "player-content/**"
      - "player-content/z_Images/**"
      - "quartz.config.yaml"
      - "quartz/styles/**"
      - "quartz.lock.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npm run install-plugins

      - name: Stage published content and referenced image
        run: |
          BUILD_CONTENT="$(mktemp -d)"
          echo "BUILD_CONTENT=$BUILD_CONTENT" >> "$GITHUB_ENV"
          cp -a "player-content/8. Player Wiki/." "$BUILD_CONTENT/"
          cp "player-content/z_Images/Theteamoutside.png" "$BUILD_CONTENT/Theteamoutside.png"

      - name: Build published player notes
        run: node quartz/bootstrap-cli.mjs build -d "$BUILD_CONTENT"

      - name: Verify publish filtering
        run: |
          test -f public/index.html
          if test -e public/Locations/Sathara.html; then
            echo "ERROR: Sathara.md has publish: false but was emitted."
            exit 1
          fi
          echo "Publish filtering passed: the unpublished Sathara page is absent."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
